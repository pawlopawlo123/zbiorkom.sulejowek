const coursesBox = document.getElementById("courses");
const sideMenu = document.getElementById("sideMenu");
const menuList = document.getElementById("menuList");
const stopTitle = document.getElementById("stopTitle");
const overlay = document.getElementById("overlay");

let currentStopId = localStorage.getItem("selectedStop") || Object.keys(stops)[0];

function toggleMenu(){
  sideMenu.classList.toggle("open");
  overlay.classList.toggle("show");
}

function closeMenu(){
  sideMenu.classList.remove("open");
  overlay.classList.remove("show");
}

Object.keys(stops).forEach(id=>{
  const div=document.createElement("div");
  div.className="menu-item";
  div.textContent=stops[id].name;

  div.onclick=()=>{
    currentStopId=id;
    localStorage.setItem("selectedStop",id);
    stopTitle.textContent="Przystanek: "+stops[id].name;
    closeMenu();
    renderCourses();
  };

  menuList.appendChild(div);
});

function isWeekend(){
  const day=new Date().getDay();
  return day===0||day===6;
}

function showUpdateAvailable(){
  document.getElementById("updateAvailable").classList.add("show")
}

function updateApp(){
  location.reload(true)
}

function minutesLeft(time){
  const [h,m]=time.split(":").map(Number);
  const now=new Date();
  const target=new Date();
  target.setHours(h,m,0,0);
  return Math.round((target-now)/60000);
}

function renderCourses(){
  coursesBox.innerHTML="";
  const weekend=isWeekend();
  let all=[];

  Object.keys(stops[currentStopId].lines).forEach(lineNumber=>{
    const line=stops[currentStopId].lines[lineNumber];
    const schedule=weekend?line.weekend:line.weekday;

    schedule.forEach(start=>{
      const diff=minutesLeft(start);
      if(diff>=-1){
        all.push({line:lineNumber,color:line.color,direction:line.direction,time:start,diff});
      }
    });
  });

  all.sort((a,b)=>a.diff-b.diff);

 all.forEach(dep=>{
    coursesBox.innerHTML+=`
    <div class="course">
      <div class="left">
        <div class="line glow" style="background:${dep.color}">${dep.line}</div>
        <div class="info">→ <b>${dep.direction}</b></div>
      </div>
      <div class="time-box">
        <div class="start-time">${dep.time}</div>
        <div class="countdown">${dep.diff>0?`za ${dep.diff} min`:"teraz"}</div>
      </div>
    </div>`;
});

}

stopTitle.textContent="Przystanek: "+stops[currentStopId].name;
renderCourses();
setInterval(renderCourses,30000);
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
  }

let lastVersion = null

async function checkVersion(){

  const res = await fetch(window.location.href, { cache: "no-store" })
  const text = await res.text()

  const version = text

  if(lastVersion && version !== lastVersion){
    showUpdateAvailable()
  }

  lastVersion = version
}

setInterval(checkVersion,10000)
