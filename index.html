<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odjazdy</title>

<style>
body{
  margin:0;
  background:#0f1720;
  color:white;
  font-family:system-ui;
}

/* ===== GÓRNY PASEK ===== */
.topbar{
  display:flex;
  align-items:center;
  gap:15px;
  padding:16px;
  background:#0b111a;
  box-shadow:0 2px 10px #000;
  font-size:18px;
  font-weight:600;
}

.menu-btn{
  font-size:24px;
  cursor:pointer;
}

/* ===== MENU BOCZNE ===== */
.side-menu{
  position:fixed;
  top:0;
  left:-260px;
  width:250px;
  height:100%;
  background:#111b28;
  box-shadow:2px 0 15px #000;
  padding:20px;
  transition:0.3s;
  z-index:1000;
}

.side-menu.open{
  left:0;
}

.menu-header{
  font-size:18px;
  margin-bottom:20px;
  font-weight:600;
}

.menu-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:6px;
}

.menu-item:hover{
  background:#1c2b3d;
}

/* ===== KARTY ODJAZDÓW ===== */
.course{
  background:#050b14;
  margin:12px;
  border-radius:14px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 0 12px #000;
}

.left{
  display:flex;
  gap:14px;
  align-items:center;
}

.line{
  padding:10px 14px;
  border-radius:12px;
  font-weight:700;
  min-width:55px;
  text-align:center;
  color:white;
}

.info{
  font-size:14px;
}

.info b{
  color:#8fb7ff
}

.time-box{
  text-align:right;
  font-weight:600;
}

.start-time{
  font-size:20px;
}

.countdown{
  font-size:13px;
  color:#6faeff;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div id="stopTitle"></div>
</div>

<div class="side-menu" id="sideMenu">
  <div class="menu-header">Wybierz przystanek</div>
  <div id="menuStops"></div>
</div>

<div id="courses"></div>

<script>

/* ===========================
   PRZYSTANKI
=========================== */
const stop: {
  


/* ===========================
   LOGIKA
=========================== */

const coursesBox = document.getElementById("courses");
const sideMenu = document.getElementById("sideMenu");
const menuStops = document.getElementById("menuStops");
const stopTitle = document.getElementById("stopTitle");

let currentStopId = Object.keys(stops)[0];

function toggleMenu(){
  sideMenu.classList.toggle("open");
}

Object.keys(stops).forEach(id=>{
  const div = document.createElement("div");
  div.className="menu-item";
  div.textContent = stops[id].name;

  div.onclick = ()=>{
    currentStopId = id;
    stopTitle.textContent = "Przystanek: " + stops[id].name;
    toggleMenu();
    renderCourses();
  };

  menuStops.appendChild(div);
});

function isWeekend(){
  const day = new Date().getDay();
  return day === 0 || day === 6;
}

function minutesLeft(time){
  const [h,m]=time.split(":").map(Number);
  const now=new Date();
  const target=new Date();
  target.setHours(h,m,0,0);
  return Math.round((target-now)/60000);
}

function renderCourses(){
  coursesBox.innerHTML="";
  let allDepartures=[];
  const weekend = isWeekend();
  const lines = stops[currentStopId].lines;

  Object.keys(lines).forEach(lineNumber=>{
    const line = lines[lineNumber];
    const schedule = weekend ? line.weekend : line.weekday;

    schedule.forEach(start=>{
      const diff=minutesLeft(start);

      if(diff>=-1){
        allDepartures.push({
          line:lineNumber,
          color:line.color,
          direction:line.direction,
          time:start,
          diff:diff
        });
      }
    });
  });

  allDepartures.sort((a,b)=>a.diff-b.diff);

  allDepartures.forEach(dep=>{
    coursesBox.innerHTML+=`
      <div class="course">
        <div class="left">
          <div class="line" style="background:${dep.color}">
            ${dep.line}
          </div>
          <div class="info">
            → <b>${dep.direction}</b>
          </div>
        </div>

        <div class="time-box">
          <div class="start-time">${dep.time}</div>
          <div class="countdown">
            ${dep.diff>0?`za ${dep.diff} min`:"teraz"}
          </div>
        </div>
      </div>
    `;
  });
}

stopTitle.textContent = "Przystanek: " + stops[currentStopId].name;

renderCourses();
setInterval(renderCourses,30000);

</script>

</body>
</html>
