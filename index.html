<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odjazdy</title>

<style>
body{
  margin:0;
  background:#0f1720;
  color:white;
  font-family:system-ui;
}

.header{
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:600;
  background:#0b111a;
  box-shadow:0 2px 10px #000;
}

.course{
  background:#050b14;
  margin:12px;
  border-radius:14px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 0 12px #000;
}

.left{
  display:flex;
  gap:14px;
  align-items:center;
}

.line{
  padding:10px 14px;
  border-radius:12px;
  font-weight:700;
  min-width:55px;
  text-align:center;
  color:white;
}

.info{
  font-size:14px;
}

.info b{
  color:#8fb7ff
}

.time-box{
  text-align:right;
  font-weight:600;
}

.start-time{
  font-size:20px;
}

.countdown{
  font-size:13px;
  color:#6faeff;
}
</style>
</head>

<body>

<div class="header">Przystanek: Łukasińskiego 01</div>
<div id="courses"></div>

<script>

// ROZKŁADY
const lines = {
  "A1": {
    color:"#1e88ff",
    direction:"PKP Sulejówek Miłosna",
    weekday:[
      "05:47","06:16","06:47","07:13","07:37",
      "08:19","09:19","10:17","11:34",
      "12:37","13:48","14:39","15:33",
      "16:34","17:05","17:34","18:05",
      "18:34","19:05","20:05","21:05"
    ],
    weekend:[] // BRAK KURSU W WEEKEND
  },

  "P02": {
    color:"#e53935",
    direction:"Rynek (Stanisławów)",
    weekday:[
      "04:57","05:57","06:57","07:57",
      "09:27","11:27","13:27","14:57",
      "15:57","16:57","17:57","18:57",
      "19:57","21:27"
    ],
    weekend:[
      "05:57","09:57","12:57","15:57",
      "18:57"
    ]
  },

  "P03": {
    color:"#00c853",
    direction:"Michałów-Pętla",
    weekday:[
      "04:27","05:27","06:27","07:27",
      "08:27","10:27","12:27","14:27",
      "15:27","16:27","17:27","18:27",
      "19:27","20:27","22:27"
    ],
    weekend:[
      "08:27","11:27","14:27","17:27",
      "21:27"
     ]
  },

  "ZS2": {
    color:"#6600CC",
    direction:"Michałów-Pętla",
    weekend:[
      "17:20","17:40","19:00","21:30"
      ]
  },
};

  
const coursesBox = document.getElementById("courses");

function isWeekend(){
  const day = new Date().getDay();
  return day === 0 || day === 6; // niedziela=0, sobota=6
}

function minutesLeft(time){
  const [h,m]=time.split(":").map(Number);
  const now=new Date();
  const target=new Date();
  target.setHours(h,m,0,0);
  return Math.round((target-now)/60000);
}

function renderCourses(){
  coursesBox.innerHTML="";
  let allDepartures=[];

  const weekend = isWeekend();

  Object.keys(lines).forEach(lineNumber=>{
    const line = lines[lineNumber];

    const schedule = weekend ? line.weekend : line.weekday;

    schedule.forEach(start=>{
      const diff=minutesLeft(start);

      if(diff>=-1){
        allDepartures.push({
          line:lineNumber,
          color:line.color,
          direction:line.direction,
          time:start,
          diff:diff
        });
      }
    });
  });

  allDepartures.sort((a,b)=>a.diff-b.diff);

  allDepartures.forEach(dep=>{
    coursesBox.innerHTML+=`
      <div class="course">
        <div class="left">
          <div class="line" style="background:${dep.color}">
            ${dep.line}
          </div>
          <div class="info">
            -> <b>${dep.direction}</b>
          </div>
        </div>

        <div class="time-box">
          <div class="start-time">${dep.time}</div>
          <div class="countdown">
            ${dep.diff>0?`za ${dep.diff} min`:"teraz"}
          </div>
        </div>
      </div>
    `;
  });
}

renderCourses();
setInterval(renderCourses,30000);

</script>

</body>
</html>
