<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablica Odjazdów</title>

<style>
body{
  margin:0;
  background:#0f1720;
  color:white;
  font-family:system-ui;
}

.header{
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:600;
  background:#0b111a;
  box-shadow:0 2px 10px #000;
}

.menu-btn{
  position:absolute;
  top:15px;
  left:15px;
  font-size:26px;
  cursor:pointer;
}

.side-menu{
  position:fixed;
  left:-260px;
  top:0;
  width:250px;
  height:100%;
  background:#111a24;
  padding:20px;
  transition:.3s;
  overflow:auto;
  z-index:1000;
}

.side-menu.active{
  left:0;
}

.side-menu h3{
  margin-top:20px;
  margin-bottom:10px;
}

.side-menu div{
  padding:8px 0;
  cursor:pointer;
}

.side-menu div:hover{
  color:#1e88ff;
}

.course{
  background:#050b14;
  margin:12px;
  border-radius:14px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 0 12px #000;
}

.left{
  display:flex;
  gap:14px;
  align-items:center;
}

.line{
  padding:10px 14px;
  border-radius:12px;
  font-weight:700;
  min-width:55px;
  text-align:center;
  color:white;
}

.info{
  font-size:14px;
}

.info b{
  color:#8fb7ff
}

.time-box{
  text-align:right;
  font-weight:600;
}

.start-time{
  font-size:20px;
}

.countdown{
  font-size:13px;
  color:#6faeff;
}
</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div id="sideMenu" class="side-menu">
  <h3>Linie</h3>
  <div id="lineList"></div>
  <h3>Przystanki</h3>
  <div id="stopList"></div>
</div>

<div class="header">Przystanek: Łukasińskiego 01</div>
<div id="courses"></div>

<script>

const lines = {

  "A1": {
    color:"#1e88ff",
    stops:{
      "Łukasińskiego 01":{
        weekday:["05:47","06:16","06:47","07:13","07:37","08:19","09:19"],
        weekend:[]
      },
      "Dąbrowskiego 01":{
        weekday:["06:00","06:30","07:00","08:00"],
        weekend:[]
      }
    }
  },

  "P02": {
    color:"#e53935",
    stops:{
      "Łukasińskiego 01":{
        weekday:["06:10","07:10","08:10","09:10"],
        weekend:["07:30","09:30","11:30","13:30"]
      },
      "Dąbrowskiego 01":{
        weekday:["06:20","07:20","08:20"],
        weekend:["08:00","10:00","12:00"]
      }
    }
  },

  "P03": {
    color:"#00c853",
    stops:{
      "Łukasińskiego 01":{
        weekday:["06:30","07:30","08:30","09:30"],
        weekend:["08:00","10:00","12:00","14:00"]
      },
      "Dąbrowskiego 01":{
        weekday:["06:40","07:40","08:40"],
        weekend:["09:00","11:00","13:00"]
      }
    }
  }

};

let currentLine = "A1";
let currentStop = "Łukasińskiego 01";

const coursesBox = document.getElementById("courses");

function toggleMenu(){
  document.getElementById("sideMenu").classList.toggle("active");
}

function isWeekend(){
  const day = new Date().getDay();
  return day === 0 || day === 6;
}

function minutesLeft(time){
  const [h,m]=time.split(":").map(Number);
  const now=new Date();
  const target=new Date();
  target.setHours(h,m,0,0);
  return Math.round((target-now)/60000);
}

function renderLineList(){
  const lineList = document.getElementById("lineList");
  lineList.innerHTML="";

  Object.keys(lines).forEach(line=>{
    lineList.innerHTML+=`
      <div onclick="selectLine('${line}')">
        ${line}
      </div>
    `;
  });
}

function renderStopList(){
  const stopList = document.getElementById("stopList");
  stopList.innerHTML="";

  const stops = Object.keys(lines[currentLine].stops);

  stops.forEach(stop=>{
    stopList.innerHTML+=`
      <div onclick="selectStop('${stop}')">
        ${stop}
      </div>
    `;
  });
}

function selectLine(line){
  currentLine = line;
  renderStopList();
}

function selectStop(stop){
  currentStop = stop;
  document.querySelector(".header").innerText =
    "Przystanek: " + stop;
  renderCourses();
  toggleMenu();
}

function renderCourses(){
  coursesBox.innerHTML="";

  const weekend = isWeekend();
  const schedule = weekend
    ? lines[currentLine].stops[currentStop].weekend
    : lines[currentLine].stops[currentStop].weekday;

  let departures=[];

  schedule.forEach(time=>{
    const diff = minutesLeft(time);
    if(diff>=-1){
      departures.push({
        time:time,
        diff:diff
      });
    }
  });

  departures.sort((a,b)=>a.diff-b.diff);

  departures.forEach(dep=>{
    coursesBox.innerHTML+=`
      <div class="course">
        <div class="left">
          <div class="line" style="background:${lines[currentLine].color}">
            ${currentLine}
          </div>
          <div class="info">
            Kierunek: <b>${currentStop}</b>
          </div>
        </div>
        <div class="time-box">
          <div class="start-time">${dep.time}</div>
          <div class="countdown">
            ${dep.diff>0?`za ${dep.diff} min`:"teraz"}
          </div>
        </div>
      </div>
    `;
  });
}

renderLineList();
renderStopList();
renderCourses();
setInterval(renderCourses,30000);

</script>

</body>
</html>
