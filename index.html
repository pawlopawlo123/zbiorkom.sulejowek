body{
  margin:0;

.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  align-items:center;
  gap:15px;
  padding:16px;
  background:#0b111a;
  box-shadow:0 2px 10px #000;
  font-weight:600;
  z-index:200;
}

.menu-btn{
  font-size:24px;
  cursor:pointer;
}

.side-menu{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:#111b28;
  padding-top:70px;
  transition:0.3s;
  box-shadow:2px 0 15px #000;
  z-index:100;
}

.menu-title{
  padding:16px 18px;
  font-weight:700;
  font-size:16px;
  border-bottom:1px solid #1c2b3d;
  background:#0b111a;
}

.side-menu.open{
  left:0;
}

.menu-item{
  padding:14px 18px;
  cursor:pointer;
  border-bottom:1px solid #1c2b3d;
}

.menu-item:hover{
  background:#1c2b3d;
}

/* NOWE – overlay */
#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:90;
}

#overlay.show{
  display:block;
}

.course{
  background:#050b14;
  margin:12px;
  border-radius:14px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 0 12px #000;
}

.left{
  display:flex;
  gap:14px;
  align-items:center;
}

.line {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
  }

.info{
  font-size:14px;
}

.info b{
  color:#8fb7ff;
}

.time-box{
  text-align:right;
}

.start-time{
  font-size:20px;
  font-weight:600;
}

.countdown{
  font-size:13px;
  color:#6faeff;
}
  #courses{

const coursesBox = document.getElementById("courses");
const sideMenu = document.getElementById("sideMenu");
const stopTitle = document.getElementById("stopTitle");
const overlay = document.getElementById("overlay");

let currentStopId = localStorage.getItem("selectedStop") || Object.keys(stops)[0];

function toggleMenu(){
  sideMenu.classList.toggle("open");
  overlay.classList.toggle("show");
}

function closeMenu(){
  sideMenu.classList.remove("open");
  overlay.classList.remove("show");
}

Object.keys(stops).forEach(id=>{
  const div=document.createElement("div");
  div.className="menu-item";
  div.textContent=stops[id].name;

  div.onclick=()=>{
    currentStopId=id;
    localStorage.setItem("selectedStop",id);
    stopTitle.textContent="Przystanek: "+stops[id].name;
    closeMenu();
    renderCourses();
  };

  sideMenu.appendChild(div);
});

function isWeekend(){
  const day=new Date().getDay();
  return day===0||day===6;
}

function minutesLeft(time){
  const [h,m]=time.split(":").map(Number);
  const now=new Date();
  const target=new Date();
  target.setHours(h,m,0,0);
  return Math.round((target-now)/60000);
}

function renderCourses(){
  coursesBox.innerHTML="";
  const weekend=isWeekend();
  let all=[];

  Object.keys(stops[currentStopId].lines).forEach(lineNumber=>{
    const line=stops[currentStopId].lines[lineNumber];
    const schedule=weekend?line.weekend:line.weekday;

    schedule.forEach(start=>{
      const diff=minutesLeft(start);
      if(diff>=-1){
        all.push({line:lineNumber,color:line.color,direction:line.direction,time:start,diff});
      }
    });
  });

  all.sort((a,b)=>a.diff-b.diff);

  all.forEach(dep=>{
    coursesBox.innerHTML+=`
    <div class="course">
      <div class="left">
        <div class="line" style="background:${dep.color}">${dep.line}</div>
        <div class="info">→ <b>${dep.direction}</b></div>
      </div>
      <div class="time-box">
        <div class="start-time">${dep.time}</div>
        <div class="countdown">${dep.diff>0?`za ${dep.diff} min`:"teraz"}</div>
      </div>
    </div>`;
  });
}

stopTitle.textContent="Przystanek: "+stops[currentStopId].name;
renderCourses();
setInterval(renderCourses,30000);
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
