// =========================
// LOGIKA
// =========================

const stopSelect = document.getElementById("stopSelect");
const coursesBox = document.getElementById("courses");
let currentStopId = Object.keys(stops)[0];

// wypełnienie selecta
Object.keys(stops).forEach(id=>{
  const option = document.createElement("option");
  option.value=id;
  option.textContent=stops[id].name;
  stopSelect.appendChild(option);
});

stopSelect.addEventListener("change",()=>{
  currentStopId=stopSelect.value;
  renderCourses();
});

function isWeekend(){
  const d=new Date().getDay();
  return d===0 || d===6;
}

function minutesLeft(time){
  const [h,m]=time.split(":").map(Number);
  const now=new Date();
  const target=new Date();
  target.setHours(h,m,0,0);
  return Math.round((target-now)/60000);
}

function renderCourses(){
  coursesBox.innerHTML="";
  const stop=stops[currentStopId];
  let departures=[];
  const weekend=isWeekend();

  Object.keys(stop.lines).forEach(lineNumber=>{
    const line=stop.lines[lineNumber];
    const schedule=weekend?line.weekend:line.weekday;

    schedule.forEach(time=>{
      const diff=minutesLeft(time);
      if(diff>=-1){
        departures.push({
          line:lineNumber,
          direction:line.direction,
          color:line.color,
          diff:diff
        });
      }
    });
  });

  departures.sort((a,b)=>a.diff-b.diff);

  departures.slice(0,6).forEach(dep=>{
    coursesBox.innerHTML+=`
      <div class="course">
        <div class="left">
          <div class="line" style="color:${dep.color}">
            ${dep.line}
          </div>
          <div class="direction">
            ${dep.direction}
          </div>
        </div>
        <div class="minutes ${dep.diff<=0?"now":""}">
          ${dep.diff>0?dep.diff+" min":"ODJAZD"}
        </div>
      </div>
    `;
  });
}

// zegar
function updateClock(){
  const now=new Date();
  document.getElementById("clock").innerText=
    now.toLocaleTimeString("pl-PL");
}

setInterval(updateClock,1000);
setInterval(renderCourses,30000);

updateClock();
renderCourses();

</script>
