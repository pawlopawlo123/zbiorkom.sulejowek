const lineA2_down = ["PKP Sulejówek (Kombatantów)","...","PKP Sulejówek Miłosna (03)"]; // w dół
const lineA2_up = ["PKP Sulejówek Miłosna |03|","...","PKP Sulejówek (Kombatantów)"]; // w górę

function toggleMenu() {
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "flex" ? "none" : "flex";
}

function showSchedule() {
  document.getElementById("scheduleContainer").innerHTML = "";
}

function filterSchedule() {
  const input = document.getElementById("stopInput").value.toLowerCase();
  const container = document.getElementById("scheduleContainer");
  container.innerHTML = "";

  for (let stop in schedule) {
    if (stop.toLowerCase().includes(input)) {
      const stopDiv = document.createElement("div");
      stopDiv.className = "stop-name";
      stopDiv.textContent = stop;
      container.appendChild(stopDiv);

      schedule[stop].forEach(time => {
        const entryDiv = document.createElement("div");
        entryDiv.className = "time-entry";

        const lineDiv = document.createElement("div");
        lineDiv.className = "line";

        if (lineA1.includes(stop)) lineDiv.classList.add("A1");
        else if (lineA2_down.includes(stop) || lineA2_up.includes(stop)) lineDiv.classList.add("A2");
        else lineDiv.textContent = "";

        lineDiv.textContent = lineDiv.classList.contains("A1") ? "A1" : lineDiv.classList.contains("A2") ? "A2" : "";

        const timeDiv = document.createElement("div");
        timeDiv.className = "time";
        timeDiv.textContent = time + " (" + minutesToDeparture(time) + " min)";

        entryDiv.appendChild(lineDiv);
        entryDiv.appendChild(timeDiv);
        container.appendChild(entryDiv);
      });
    }
  }
}

function minutesToDeparture(timeStr) {
  const now = new Date();
  const day = now.getDay();
  if (day === 0 || day === 6) return "-"; // weekend brak odliczania

  const [h, m] = timeStr.split(":").map(Number);
  const dep = new Date();
  dep.setHours(h, m, 0, 0);
  let diff = Math.round((dep - now)/60000);
  if (diff < 0) diff += 24*60;
  return diff;
}
