<html lang="pl">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sulejówek.Live">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sulejówek.Live</title>

<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-startup-image" href="splash.png">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b111a">

<style>
body{
margin:0;
background:#0f1720;
color:white;
font-family:system-ui;
overflow:hidden;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  align-items:center;
  gap:15px;
  padding:16px;
  background:#0b111a;
  box-shadow:0 2px 10px #000;
  font-weight:600;
  z-index:200;
}

.menu-btn{
  font-size:24px;
  cursor:pointer;
}

.menu-item{
  padding:14px 18px;
  cursor:pointer;
  border-bottom:1px solid #1c2b3d;
}

.menu-item:hover{
  background:#1c2b3d;
}

/* NOWE – overlay */
#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:90;
}

#overlay.show{
  display:block;
}

.course{
  background:#050b14;
  margin:12px;
  border-radius:14px;
  padding:14px;
  display:flex;
  
  justify-content:space-between;
  align-items:center;
  box-shadow:0 0 12px #000;
}

.left{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:flex-start;
  flex:1;
  min-width:0;
}

.left > div{
  display:flex;
  align-items:center;
  gap:12px;
}

.info{
  font-size:15px;
  margin:0;
  white-space:nowrap;
}

.course-vehicle{
  font-size:12px;
  color:#9aa4b2;
  margin-top:6px;
}

.line{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  padding:6px 12px;
  border-radius:999px;

  color:white;
  font-size:16px;
  font-weight:700;
  line-height:1;

  width:auto;          /* 🔥 dopasowanie */
  min-width:unset;    /* usuwa stare */
  white-space:nowrap; /* nie łamie tekstu */

  box-shadow:0 2px 6px rgba(0,0,0,0.25);
}

.info{
  font-size:14px;
}

.info b{
  color:#8fb7ff;
}

.time-box{
  text-align:right;
}

.start-time{
  font-size:20px;
  font-weight:600;
}

.countdown{
  font-size:13px;
  color:#6faeff;
}

#courses{
  position:fixed;
  top:67px;
  left:0;
  right:0;
  bottom:0;

  overflow-y:auto;
  -webkit-overflow-scrolling:touch;

  box-sizing:border-box;
  padding-bottom:0;
}

  .no-departures{
  color:#aaa;
  font-size:14px;
  margin-top:6px;
}

.modal{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:1000;
}

.modal-content{
background:white;
margin:15% auto;
padding:20px;
width:300px;
border-radius:10px;
text-align:center;
}

.modal-content img{
width:100%;
border-radius:8px;
margin-bottom:10px;
}

.close{
float:right;
font-size:22px;
cursor:pointer;
  }

.updateAvailable{
position:fixed;
top:-60px;
left:0;
width:100%;
background:#00c853;
color:white;
text-align:center;
padding:14px;
font-weight:bold;
z-index:9999;
transition:0.3s;
cursor:pointer;
}

#updateAvailable.show{
top:0;
}

.departure{
  display:flex;
  align-items:center;
  padding:12px;
  margin:10px;
  border-radius:20px;
  color:white;
  font-family:sans-serif;
}

.lineBox{
  width:75px;
  height:60px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:white;
  font-weight:bold;
}

.busIcon{
  width:18px;
  height:18px;
  color:white;
}

.lineNumber{
  font-size:18px;
}

.lineBox span{
  font-size:18px;
}

.middle{
  flex:1;
}

.direction{
  font-size:15px;
  font-weight:500;
}

.right{
  text-align:right;
}

.hour{
  font-size:18px;
  font-weight:bold;
}

.mins{
  font-size:13px;
  opacity:0.9;
}

.now{
  color:#ff3b30;
  font-weight:bold;
  }

  #results{
  height: 80vh;        /* wysokość listy */
  overflow-y: auto;    /* WŁĄCZA SCROLL */
  padding-bottom: 20px;
  }

  .side-menu{
position:fixed;
top:67px;
left:-260px;
width:260px;
height:calc(100vh - 67px);
background:#111b28;
transition:0.3s;
box-shadow:2px 0 15px #000;
z-index:100;

display:flex;
flex-direction:column;

overflow:hidden;
}

.menu-list{
  height:calc(100vh - 130px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:0;
  box-sizing:border-box;
}
  
.side-menu.open{
  left:0;
}

/* 🔥 KLUCZ */
.menu-title{
  padding:16px 18px;
  font-weight:700;
  font-size:16px;
  border-bottom:1px solid #1c2b3d;
  background:#0b111a;

  flex-shrink:0;  /* 🔥 żeby nie znikał */
}
  
.bus-icon{
  width:24px;
  height:24px;
  object-fit:contain;
}

.no-departures-center{
  min-height:calc(100vh - 120px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  color:#9aa4b2;
  font-size:22px;
  font-weight:600;
  padding:20px;
  box-sizing:border-box;
}

.big{
font-size:18px;
font-weight:700;
padding:20px;
}

.menu-back{
padding:16px;
background:#162435;
cursor:pointer;
font-weight:600;
border-bottom:1px solid #1c2b3d;
}

.line-route{
padding:16px;
border-bottom:1px solid #1c2b3d;
}

.line-title{
font-size:18px;
font-weight:700;
margin-bottom:10px;
}

.route-stop{
font-size:14px;
color:#9fb3c8;
margin:5px 0;
}

.menu-list{
flex:1;
overflow-y:auto;
-webkit-overflow-scrolling:touch;
padding-bottom:0;
min-height:0; /* 🔥 TO NAPRAWIA SCROLL */
}

 #stopsMenu,
#linesMenu{
  height:100%;
  min-height:0;
  flex-direction:column;
}

 #pullRefresh{
  position:fixed;
  top:60px;
  left:50%;
  transform:translate(-50%,-60px);
  opacity:0;
  z-index:5000;
  pointer-events:none;
}

#pullSpinner{
  width:32px;
  height:32px;
  border:4px solid #344454;
  border-top-color:#6faeff;
  border-radius:50%;
  box-sizing:border-box;
}

#pullRefresh.ready #pullSpinner{
  animation:pullSpin .7s linear infinite;
}

@keyframes pullSpin{
  to{
    transform:rotate(360deg);
  }
  }

.line-direction{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
}

.line-directions .info{
  text-align:left;
}

.course-vehicle{
  font-size:12px;
  color:#9aa4b2;
  margin-top:6px;
}
</style>
</head>

<div class="menu-list" id="linesList"></div>

</div>

<div id="overlay" onclick="closeMenu()"></div>

function isHoliday(){
  const today = new Date();
  const y = today.getFullYear();

  const d = String(today.getDate()).padStart(2,"0");
  const m = String(today.getMonth()+1).padStart(2,"0");

  const date = `${d}.${m}`;

  const holidays = [
    "01.01", // Nowy Rok
    "06.01", // Trzech Króli
    "01.05", // Święto Pracy
    "03.05", // Konstytucji 3 Maja
    "15.08", // Wniebowzięcie
    "01.11", // Wszystkich Świętych
    "11.11", // Niepodległość
    "25.12", // Boże Narodzenie
    "26.12"  // Boże Narodzenie
  ];

  return holidays.includes(date);
}

function isWeekend(){
  const day = new Date().getDay();
  return day===0 || day===6 || isHoliday();
}

function showUpdateAvailable(){
  document.getElementById("updateAvailable").classList.add("show")
}

function updateApp(){
  location.reload(true)
}

function minutesLeft(time){
  const [h,m]=time.split(":").map(Number);
  const now=new Date();
  const target=new Date();
  target.setHours(h,m,0,0);
  return Math.round((target-now)/60000);
}

function renderCourses(){
  coursesBox.innerHTML="";
  const weekend=isWeekend();
  let all=[];

  Object.keys(stops[currentStopId].lines).forEach(lineNumber=>{

  if(isHoliday() && ["A1","A2","W3"].includes(lineNumber)){
    return;
  }
    const line=stops[currentStopId].lines[lineNumber];
    const schedule=weekend?line.weekend:line.weekday;

    schedule.forEach(course=>{
  const start = Array.isArray(course) ? course[0] : course;
  const vehicle = Array.isArray(course) ? course[1] : "";

  const diff = minutesLeft(start);

  if(diff >= -1){
    all.push({
      line: lineNumber,
      color: line.color,
      direction: line.direction,
      time: start,
      vehicle: vehicle,
      diff: diff
    });
  }
});
    
});

  all.sort((a,b)=>a.diff-b.diff);

if(all.length === 0){

  document.body.style.overflow = "hidden";
  coursesBox.style.overflowY = "hidden";

  coursesBox.innerHTML = `
    <div class="no-departures-center">
      W najbliższym czasie nie ma odjazdów z tego przystanku
    </div>
  `;

  return;
}

document.body.style.overflow = "hidden";
coursesBox.style.overflowY = "auto";
  
 all.forEach(dep=>{
  coursesBox.innerHTML+=`
    <div class="course">
      <div class="left">

        <div class="line-directions">
  <div class="line" style="background:${dep.color}">
    <img src="bus.svg" class="bus-icon">
    <span>${dep.line}</span>
  </div>

  <div class="info">
    → <b>${dep.direction}</b>
  </div>
</div>

${dep.vehicle ? `
<div class="course-vehicle">
  Kurs obsługiwany przez: ${dep.vehicle}
</div>
` : ""}

      </div>

      <div class="time-box">
        <div class="start-time">${dep.time}</div>
        <div class="countdown">
          ${dep.diff>0?`za ${dep.diff} min`:"teraz"}
        </div>
      </div>
    </div>`;
});

  }

stopTitle.textContent="Przystanek: "+stops[currentStopId].name; 
  renderCourses(); 
  setInterval(renderCourses,30000); 
  if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js"); 
  } 
  
  let lastVersion = null 
  
  async function checkVersion(){ 
    
  const res = await fetch(window.location.href, { cache: "no-store" }) 
  const text = await res.text() 
    
  const version = text 
    if(lastVersion && version !== lastVersion) { 
    showUpdateAvailable() 
    } 
    
    lastVersion = version 
  } 
    setInterval(checkVersion,10000)
  
</script>

<script>
let startY = 0;
let pulling = false;
let refreshArea = null;

document.addEventListener("touchstart", function(e) {

  const target = e.target.closest("#courses, .menu-list");

  if (!target) {
    pulling = false;
    return;
  }

  if (target.scrollTop === 0) {
    startY = e.touches[0].clientY;
    pulling = true;
    refreshArea = target;
  } else {
    pulling = false;
    refreshArea = null;
  }

}, {passive:true});

document.addEventListener("touchend", function(e) {

  if (!pulling || !refreshArea) return;

  const endY = e.changedTouches[0].clientY;
  const distance = endY - startY;

  if (distance > 80 && refreshArea.scrollTop === 0) {
    location.reload();
  }

  pulling = false;
  refreshArea = null;

});
                        
</script>
