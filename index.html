<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linia A1</title>
<style>
body{
margin:0;
background:#0f1720;
color:white;
font-family:system-ui;
}
.header{
padding:15px;
text-align:center;
font-size:20px;
font-weight:600;
}

.course{
background:#050b14;
margin:12px;
border-radius:14px;
padding:14px;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 0 12px #000;
cursor:pointer;
}

.left{
display:flex;
gap:12px;
align-items:center;
}

.line{
background:#1e88ff;
padding:10px 14px;
border-radius:12px;
font-weight:700;
}

.info{
font-size:14px;
}

.info b{color:#8fb7ff}

.times{
text-align:right;
font-size:16px;
}

.route{
display:none;
margin:10px;
background:#050b14;
border-radius:14px;
padding:10px;
}

.stop{
display:flex;
align-items:center;
gap:12px;
padding:8px 0;
border-bottom:1px solid #1f2a3a;
}

.dot{
width:10px;
height:10px;
background:#1e88ff;
border-radius:50%;
}

 .time-box{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  font-weight:600;
}

.start-time{
  font-size:18px;
}

.end-time{
  font-size:14px;
  opacity:.6;
  margin-top:2px;
}

</style>
</head>
<body>

<div class="header">Przystanek: Łukasińskiego 01</div>

<div id="courses"></div>


<script>
const stops = [
"PKP Sulejówek Miłosna (01)",
"Sulejówek Krótka (01)",
"Sulejówek Wyspiańskiego (02)",
"Sulejówek Szekspira (02)",
"Sulejówek Dąbrowskiego (02)",
"Sulejówek Tramwajowa (02)",
"Sulejówek Długa (01)",
"Sulejówek Łomżyńska (01)",
"Sulejówek Partyzantów (01)",
"Sulejówek Łukasińskiego (01)",
"Sulejówek Dąbrowskiego (01)",
"Sulejówek Szekspira (01)",
"Sulejówek Wyspiańskiego (01)",
"Sulejówek Głowackiego (02)",
"PKP Sulejówek Miłosna (02)",
"Sulejówek Miłosna-Pomnik (01)",
"Sulejówek Kopernika (02)",
"Sulejówek Wilsona (04)",
"Sulejówek Polna (02)",
"Sulejówek Bydgoska (02)",
"Sulejówek Warecka (01)",
"Sulejówek Cicha (01)",
"Sulejówek Zelwerowicza (01)",
"PKP Sulejówek Miłosna (01)"
];

const startTimes = [
"05:47","06:16","06:47","07:13","07:37","08:19",
"08:43","09:19","10:17","11:34","12:37","13:48",
"14:39","15:33","16:34","17:05","17:34","18:05",
"18:34","19:05","20:05","21:05"
];



const coursesBox = document.getElementById("courses");
const routeBox = document.getElementById("route");

function minutesLeft(time){
 const [h,m]=time.split(":").map(Number);
 const now=new Date();
 const target=new Date();
 target.setHours(h,m,0,0);
 return Math.round((target-now)/60000);
}

function renderCourses(){
 coursesBox.innerHTML="";
 startTimes.forEach((start,i)=>{
   const end=endTimes[i];
   const diff=minutesLeft(start);

   if(diff>=-1){
   coursesBox.innerHTML+=`
   <div class="course">
     <div class="left">
       <div class="line">A1</div>
       <div class="info">
         Z: <b>PKP Sulejówek Miłosna (01)</b><br>
         Do: <b>PKP Sulejówek Miłosna (01)</b>
       </div>
     </div>
     <div class="time-box">
      <div class="start-time">${start}</div>
      <div class="end-time">${end}</div>
       <span style="color:#6faeff;font-size:13px">
         ${diff>0?`za ${diff} min`:"teraz"}
       </span>
     </div>
   </div>`;
   }
 });
}



renderCourses();
setInterval(renderCourses,30000);
</script>

</body>
</html>
