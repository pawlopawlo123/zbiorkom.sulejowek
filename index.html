<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odjazdy</title>

<style>
body{
  margin:0;
  background:#0f1720;
  color:white;
  font-family:system-ui;
}

.topbar{
  display:flex;
  align-items:center;
  gap:15px;
  padding:16px;
  background:#0b111a;
  box-shadow:0 2px 10px #000;
  font-weight:600;
}

.menu-btn{
  font-size:24px;
  cursor:pointer;
}

.side-menu{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:#111b28;
  padding-top:70px;
  transition:0.3s;
  box-shadow:2px 0 15px #000;
  z-index:100;
}

  .menu-title{
  padding:16px 18px;
  font-weight:700;
  font-size:16px;
  border-bottom:1px solid #1c2b3d;
  background:#0b111a;
  }

.side-menu.open{
  left:0;
}

.menu-item{
  padding:14px 18px;
  cursor:pointer;
  border-bottom:1px solid #1c2b3d;
}

.menu-item:hover{
  background:#1c2b3d;
}

.course{
  background:#050b14;
  margin:12px;
  border-radius:14px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 0 12px #000;
}

.left{
  display:flex;
  gap:14px;
  align-items:center;
}

.line{
  padding:10px 14px;
  border-radius:12px;
  font-weight:700;
  min-width:55px;
  text-align:center;
  color:white;
}

.info{
  font-size:14px;
}

.info b{
  color:#8fb7ff;
}

.time-box{
  text-align:right;
}

.start-time{
  font-size:20px;
  font-weight:600;
}

.countdown{
  font-size:13px;
  color:#6faeff;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div id="stopTitle"></div>
</div>

<div class="side-menu" id="sideMenu">
  <div class="menu-title">Wybierz przystanek:</div>
</div>

<div id="courses"></div>

<script>

/* =========================
   PEŁNY ROZKŁAD
========================= */

const stops = {

"Łukasinskiego 01":{

"A1":{

weekend:[]
},

color:"#e53935",
direction:"Rynek (Stanisławów)",
weekday:["04:57","05:57","06:57","07:57","09:27","11:27","13:27","14:57","15:57","16:57","17:57","18:57","19:57","21:27"],
weekend:["05:57","09:57","12:57","15:57","18:57"]
},
  
"P03":{
color:"#00c853",
direction:"Michałów-Pętla",
weekday:["04:27","05:27","06:27","07:27","08:27","10:27","12:27","14:27","15:27","16:27","17:27","18:27","19:27","20:27","22:27"],
weekend:["08:27","11:27","14:27","17:27","21:27"]
  }
 }
},

"Michałów-Pętla 01":{
name:"Michałów-Pętla 01",
lines:{
"P03":{
color:"#00c853",
direction:"Okuniew-Rynek",
weekday:["05:08","06:08","07:08","08:08","09:08","11:08","13:08","15:08","16:08","17:08","18:08","19:08","20:08","21:08","23:08"],

  }
 }
},

"Rynek (Stanisławów) 01":{
name:"Rynek (Stanisławów) 01",
lines:{
"P02":{
color:"#e53935",
direction:"Okuniew-Rynek",
weekday:["05:35","06:35","07:35","08:35","10:05","12:05","14:05","15:35","16:35","17:35","18:35","19:35","20:35","22:05"],
weekend:["07:35","10:35","13:35","16:35","20:35"]
  }
 }
},

"PKP Sulejówek Miłosna 01":{
name:"PKP Sulejówek Miłosna 01",
lines:{
"A1":{
color:"#1e88ff",
direction:"Łukasińskiego",
weekday:["05:38","06:07","06:38","07:04","07:28","08:10","08:34","09:10","10:08","11:25","12:28","13:39","14:30","15:24","16:25","16:56","17:25","17:56","18:25","18:56","19:56","20:56"],
weekend:[]
},
  
"P02":{
color:"#e53935",
direction:"Okuniew-Rynek",
weekday:["06:05","07:05","08:05","09:05","10:35","12:35","14:35","16:05","17:05","18:05","19:05","20:05","21:05","22:35"],
weekend:["08:05","11:05","14:05","17:05","21:05"]
},
  
"P03":{

direction:"Okuniew-Rynek",
weekday:["05:35","06:35","07:35","08:35","09:35","11:35","13:35","15:35","16:35","17:35","18:35","19:35","20:35","21:35","23:35"],
weekend:["05:35","09:35","12:35","15:35","18:35","22:35"]
  }
 }
},

"Okuniew-Rynek 01":{
name:"Okuniew-Rynek 01",
lines:{
"P02":{
color:"#e53935",
direction:"Rynek (Stanisławów)",
weekday:["04:52","05:52","06:52","07:52","09:22","11:22","13:22","14:52","15:52","16:52","17:52","18:52","19:52","21:22"],
weekend:["05:52","09:52","12:52","15:52","18:52"]
},
  
"P03":{
color:"#00c853",
direction:"Michałów-Pętla",
weekday:["04:22","05:22","06:22","07:22","08:22","10:22","12:22","14:22","15:22","16:22","17:22","18:22","19:22","20:22","22:22"],
weekend:["08:22","11:22","14:22","17:22","21:22"]
  }
 }
}

};

/* ========================= */

const coursesBox = document.getElementById("courses");
const sideMenu = document.getElementById("sideMenu");
const stopTitle = document.getElementById("stopTitle");

let currentStopId = localStorage.getItem("selectedStop") || Object.keys(stops)[0];

function toggleMenu(){
  sideMenu.classList.toggle("open");
}

Object.keys(stops).forEach(id=>{
  const div=document.createElement("div");
  div.className="menu-item";
  div.textContent=stops[id].name;

  div.onclick=()=>{
    currentStopId=id;
    localStorage.setItem("selectedStop",id);
    stopTitle.textContent="Przystanek: "+stops[id].name;
    sideMenu.classList.remove("open");
    renderCourses();
  };

  sideMenu.appendChild(div);
});

function isWeekend(){
  const day=new Date().getDay();
  return day===0||day===6;
}

function minutesLeft(time){
  const [h,m]=time.split(":").map(Number);
  const now=new Date();
  const target=new Date();
  target.setHours(h,m,0,0);
  return Math.round((target-now)/60000);
}

function renderCourses(){
  coursesBox.innerHTML="";
  const weekend=isWeekend();
  let all=[];

  Object.keys(stops[currentStopId].lines).forEach(lineNumber=>{
    const line=stops[currentStopId].lines[lineNumber];
    const schedule=weekend?line.weekend:line.weekday;

    schedule.forEach(start=>{
      const diff=minutesLeft(start);
      if(diff>=-1){
        all.push({line:lineNumber,color:line.color,direction:line.direction,time:start,diff});
      }
    });
  });

  all.sort((a,b)=>a.diff-b.diff);

  all.forEach(dep=>{
    coursesBox.innerHTML+=`
    <div class="course">
      <div class="left">
        <div class="line" style="background:${dep.color}">${dep.line}</div>
        <div class="info">→ <b>${dep.direction}</b></div>
      </div>
      <div class="time-box">
        <div class="start-time">${dep.time}</div>
        <div class="countdown">${dep.diff>0?`za ${dep.diff} min`:"teraz"}</div>
      </div>
    </div>`;
  });
}

stopTitle.textContent="Przystanek: "+stops[currentStopId].name;
renderCourses();
setInterval(renderCourses,30000);

</script>

</body>
</html>
