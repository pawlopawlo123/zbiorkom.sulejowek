<!DOCTYPE html><html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Linia A1 – Sulejówek</title>
<style>
body{margin:0;background:#0f1720;color:#fff;font-family:system-ui}
.header{padding:14px;font-size:20px;text-align:center;font-weight:600}
.course{background:#0b1220;margin:12px;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.line{background:#1e88ff;padding:8px 12px;border-radius:10px;font-weight:700}
.time{font-size:20px}
.until{color:#66aaff;font-size:14px}
.stop-title{text-align:center;font-size:18px;margin:10px 0;color:#8fb7ff}
.timeline{margin:12px}
.stop{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #1f2a3a}
.dot{width:10px;height:10px;border-radius:50%;background:#1e88ff}
</style>
</head>
<body>
<div class="header">Linia A1</div>
<div id="courses"></div>
<div class="stop-title">Trasa A1</div>
<div class="timeline" id="route"></div>
<script>
const stops=[
"PKP Sulejówek Miłosna (01)","Sulejówek Krótka (01)","Sulejówek Wyspiańskiego (02)","Sulejówek Szekspira (02)","Sulejówek Dąbrowskiego (02)","Sulejówek Tramwajowa (02)","Sulejówek Długa (01)","Sulejówek Łomżyńska (01)","Sulejówek Partyzantów (01)","Sulejówek Łukasińskiego (01)","Sulejówek Dąbrowskiego (01)","Sulejówek Szekspira (01)","Sulejówek Wyspiańskiego (01)","Sulejówek Głowackiego (02)","PKP Sulejówek Miłosna (02)","Sulejówek Miłosna-Pomnik (01)","Sulejówek Kopernika (02)","Sulejówek Wilsona (04)","Sulejówek Polna (02)","Sulejówek Bydgoska (02)","Sulejówek Warecka (01)","Sulejówek Cicha (01)","Sulejówek Zelwerowicza (01)","PKP Sulejówek Miłosna"
];const times=["05:38","06:07","06:38","07:04","07:28","08:10","08:34","09:10","10:08","11:25","12:28","13:39","14:30","15:24","16:25","16:56","17:25","17:56","18:25","18:56","19:56","20:56"];

const courseBox=document.getElementById('courses');

function minutesTo(t){ const [h,m]=t.split(':').map(Number); const now=new Date(); const target=new Date(); target.setHours(h,m,0,0); let diff=Math.round((target-now)/60000); return diff; }

function renderCourses(){ courseBox.innerHTML=''; times.forEach(t=>{ const diff=minutesTo(t); if(diff>=-1){ courseBox.innerHTML+=`

   <div class="course">
     <div class="line">A1</div>
     <div class="time">${t}</div>
     <div class="until">${diff>0?`za ${diff} min`:'teraz'}</div>
   </div>`;
  }
 })
}const routeBox=document.getElementById('route'); stops.forEach(s=>{ routeBox.innerHTML+=<div class="stop"><div class="dot"></div>${s}</div> });

renderCourses(); setInterval(renderCourses,30000); </script>

</body>
</html>
