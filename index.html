<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linia A1</title>
<style>
body{
margin:0;
background:#0f1720;
color:white;
font-family:system-ui;
}
.header{
padding:15px;
text-align:center;
font-size:20px;
font-weight:600;
}
.course{
background:#0b1220;
margin:12px;
border-radius:14px;
padding:14px;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 0 10px #000;
}
.line{
background:#1e88ff;
padding:8px 12px;
border-radius:10px;
font-weight:700;
}
.time{font-size:20px}
.until{color:#6faeff;font-size:14px}
.route{
margin:10px;
}
.stop{
display:flex;
align-items:center;
gap:12px;
padding:10px 0;
border-bottom:1px solid #1f2a3a;
}
.dot{
width:10px;
height:10px;
background:#1e88ff;
border-radius:50%;
}
.title{
text-align:center;
color:#7fb0ff;
margin:10px;
}
</style>
</head>
<body>

<div class="header">Linia A1 – odjazdy</div>

<div id="courses"></div>

<div class="title">Trasa linii A1</div>
<div class="route" id="route"></div>

<script>
const stops = [
"PKP Sulejówek Miłosna (01)",
"Sulejówek Krótka (01)",
"Sulejówek Wyspiańskiego (02)",
"Sulejówek Szekspira (02)",
"Sulejówek Dąbrowskiego (02)",
"Sulejówek Tramwajowa (02)",
"Sulejówek Długa (01)",
"Sulejówek Łomżyńska (01)",
"Sulejówek Partyzantów (01)",
"Sulejówek Łukasińskiego (01)",
"Sulejówek Dąbrowskiego (01)",
"Sulejówek Szekspira (01)",
"Sulejówek Wyspiańskiego (01)",
"Sulejówek Głowackiego (02)",
"PKP Sulejówek Miłosna (02)",
"Sulejówek Miłosna-Pomnik (01)",
"Sulejówek Kopernika (02)",
"Sulejówek Wilsona (04)",
"Sulejówek Polna (02)",
"Sulejówek Bydgoska (02)",
"Sulejówek Warecka (01)",
"Sulejówek Cicha (01)",
"Sulejówek Zelwerowicza (01)",
"PKP Sulejówek Miłosna"
];

const times = [
"05:38","06:07","06:38","07:04","07:28","08:10",
"08:34","09:10","10:08","11:25","12:28","13:39",
"14:30","15:24","16:25","16:56","17:25","17:56",
"18:25","18:56","19:56","20:56"
];

const coursesBox = document.getElementById("courses");
const routeBox = document.getElementById("route");

function minutesLeft(time){
const [h,m] = time.split(":").map(Number);
const now = new Date();
const target = new Date();
target.setHours(h,m,0,0);
return Math.round((target-now)/60000);
}

function renderCourses(){
coursesBox.innerHTML="";
times.forEach(t=>{
const diff = minutesLeft(t);
if(diff >= -1){
coursesBox.innerHTML += `
<div class="course">
 <div class="line">A1</div>
 <div class="time">${t}</div>
 <div class="until">${diff>0?`za ${diff} min`:"teraz"}</div>
</div>`;
}
});
}

stops.forEach(s=>{
routeBox.innerHTML += `
<div class="stop">
 <div class="dot"></div>
 ${s}
</div>`;
});

renderCourses();
setInterval(renderCourses, 30000);
</script>

</body>
</html>
